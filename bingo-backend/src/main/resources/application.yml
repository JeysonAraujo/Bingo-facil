spring:
  application:
    name: bingo-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/bingodb
    username: bingo_user
    password: bingo_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true

server:
  port: 8080

app:
  activation-base-url: http://localhost:3000
