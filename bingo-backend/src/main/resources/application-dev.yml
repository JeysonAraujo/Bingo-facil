spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bingodb?stringtype=unspecified
    username: bingo_user
    password: bingo_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  flyway:
    enabled: true
